name: refresh-release-artifacts

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - name: Resolve latest published release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Latest release tag is not a version tag: $tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'Refreshing artifacts for latest published release `%s`.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with bounded parallelism
        run: GOMAXPROCS=2 go test -p 2 ./...
      - name: Sandbox doctor
        run: go run ./cmd/kit doctor --sandbox

  build-binaries:
    needs: [resolve-release, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-checksums"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/release-checksums"
      - name: Build static binary and platform archive
        env:
          VERSION: ${{ needs.resolve-release.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          mkdir -p dist/package
          binary=kit
          if [ "$GOOS" = windows ]; then binary=kit.exe; fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X aoe2kit/pkg/kit.Version=$VERSION -X aoe2kit/pkg/kit.Commit=$COMMIT -X aoe2kit/pkg/kit.BuildType=release" \
            -o "dist/package/$binary" ./cmd/kit
          cp "dist/package/$binary" "dist/aoe2kit_${VERSION}_${GOOS}_${GOARCH}${binary#kit}"
          cp README.md START_HERE.md AI_GUIDE.md LICENSE NOTICE.md dist/package/
          archive="aoe2kit_${VERSION}_${GOOS}_${GOARCH}.zip"
          (cd dist/package && zip -q -r "../$archive" .)
      - name: Verify binary against published checksum
        env:
          VERSION: ${{ needs.resolve-release.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          filename="aoe2kit_${VERSION}_${GOOS}_${GOARCH}${suffix}"
          expected=$(awk -v file="./$filename" '$2 == file { print $1 }' \
            "$RUNNER_TEMP/release-checksums/SHA256SUMS")
          actual=$(sha256sum "dist/$filename" | awk '{ print $1 }')
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "Refreshed binary checksum differs from published release: $filename" >&2
            exit 1
          fi
      - name: Verify Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          VERSION: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          ./dist/package/kit version --json \
            | jq -e --arg version "$VERSION" --arg commit "$(git rev-parse HEAD)" \
              '.version == $version and .commit == $commit' >/dev/null
          ./dist/package/kit doctor --sandbox
      - name: Attest binary and platform archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/aoe2kit_*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kit-assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/aoe2kit_*
          if-no-files-found: error
          retention-days: 90

  build-source:
    needs: [resolve-release, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vendor and prove offline build
        env:
          VERSION: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          mkdir -p "$RUNNER_TEMP/kit-source" "$RUNNER_TEMP/gomod-cache" dist
          jq -j '.files[] | select(test("\\.(png|jpe?g|gif|bmp|dds|sld|slp|smx|smp|dat|drs|aoe2scenario|aoe2campaign|aoe2record)$"; "i") | not) + "\u0000"' release/public-files.json \
            | tar --null -T - -cf - \
            | tar -xf - -C "$RUNNER_TEMP/kit-source"
          cd "$RUNNER_TEMP/kit-source"
          if find . -type f | grep -Ei '\.(png|jpe?g|gif|bmp|dds|sld|slp|smx|smp|dat|drs|aoe2scenario|aoe2campaign|aoe2record)$'; then
            echo "public source allowlist contains image or game data" >&2
            exit 1
          fi
          go build -buildvcs=false \
            -ldflags "-X aoe2kit/pkg/kit.Version=$VERSION -X aoe2kit/pkg/kit.Commit=$COMMIT -X aoe2kit/pkg/kit.BuildType=release" \
            -o "$RUNNER_TEMP/kit-manifest" ./cmd/kit
          "$RUNNER_TEMP/kit-manifest" manifest > KIT_MANIFEST.json
          printf '{"profile":"public","kit_version":"%s"}\n' "$VERSION" > KIT_PROFILE.json
          GOFLAGS=-buildvcs=false GOMAXPROCS=2 \
            "$RUNNER_TEMP/kit-manifest" portable-check . --profile public
          go mod vendor
          find . -type f \( \
            -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o \
            -iname '*.bmp' -o -iname '*.dds' -o -iname '*.sld' -o -iname '*.slp' -o \
            -iname '*.smx' -o -iname '*.smp' -o -iname '*.dat' -o -iname '*.drs' -o \
            -iname '*.aoe2scenario' -o -iname '*.aoe2campaign' -o -iname '*.aoe2record' \
          \) -delete
          if find . -type f | grep -Ei '\.(png|jpe?g|gif|bmp|dds|sld|slp|smx|smp|dat|drs|aoe2scenario|aoe2campaign|aoe2record)$'; then
            echo "vendored source contains image or game data" >&2
            exit 1
          fi
          GOPROXY=off GOSUMDB=off GOMODCACHE="$RUNNER_TEMP/gomod-cache" \
            go build -mod=vendor -buildvcs=false -trimpath \
            -ldflags "-s -w -X aoe2kit/pkg/kit.Version=$VERSION -X aoe2kit/pkg/kit.Commit=$COMMIT -X aoe2kit/pkg/kit.BuildType=release" \
            -o "$RUNNER_TEMP/kit-offline-build" ./cmd/kit
          zip -q -r "$GITHUB_WORKSPACE/dist/aoe2kit_${VERSION}_source-vendored.zip" .
      - name: Attest vendored source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*_source-vendored.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kit-assets-source
          path: dist/*_source-vendored.zip
          if-no-files-found: error
          retention-days: 90
